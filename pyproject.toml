[project]
name = "python_project"
version = "0.1.0"
description = "A minimal Python project scaffold."
readme = "README.md"
authors = [
  { name = "kai" }
]
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = ["pytest>=7.0", "requests>=2.28.0"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
